<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surpresa</title>
    <style>

        body{
            background-color: rgb(122, 154, 184);
        }

        .janela-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            z-index: 9999; 
        }

        .janela-conteudo {
            background-color: #caadd6;
            padding: 30px;
            border-radius: 12px;
            outline: 5px solid #9d12d4;  
            outline-offset: 5px;           
            height: 85%;
            max-width: 700px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            
        }

        .sub-janela-conteudo {
            background-color: rgb(122, 154, 184);
            padding: 25px;
            border-radius: 12px;
            outline: 4px solid #56fa87; 
            outline-offset: 4px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
            position: relative;
            text-align: center;
        }

        .botao-fechar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #ff0000;
        }

        .invisivel {
            display: none !important;
        }

        .botao-abrir {  
            height: 300px; 
            width: 300px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 25px; 
            cursor: pointer; 
            border-radius: 50%; 
            border: 8px solid #56fa87;
            background-color: rgb(55, 96, 134);
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
     
    </style>
</head>
<body>

    <button id="btnAbrir" class="botao-abrir" style="color: #ffffff;">✨Abrir Surpresa✨</button>

    <div id="minhaJanela" class="janela-fundo invisivel">
        
        <div class="janela-conteudo">

            <button class="botao-fechar" id="btnFechar">&times;</button>
        
            <h2 style="text-align: center;">FELIZ DIA DOS NAMORADOS AMORRRRRR ;)</h2>
            <h3 style="text-align: center;">💖💖💖💖💖💖💖💖💖💖💖💖💖💖💖💖💖💖💖💖💖</h3>
            <div style="background-color: #ffffff; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; border-left: 5px solid #9d12d4; margin-bottom: 20px;">
                Toca aqui para reviver nossos melhores dias! ✨
                <button id="meuBotao1" style="display: block; width: 100%; margin-top: 15px; padding: 10px; background-color: #9d12d4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
                    ❤️
                 </button>
                  <a href="https://drive.google.com/file/d/16wzVIdKiRmnDf3nGcY8vWlKfffpTg7cP/view?usp=drivesdk23wqsaz\" target="_blank" style="text-decoration: none;">
                     <button id="meuBotao2" type="button" style="display: block; width: 100%; margin-top: 15px; padding: 10px; background-color: #9d12d4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;"> 
                     Memories 💞 
                  </button> 
                 </a>
            </div>
            <div style="display: flex; justify-content: center; align-items: center; margin-top: 10px;"> 
                <img id="fotoSurpresa" src="https://images.pexels.com/photos/18175449/pexels-photo-18175449/free-photo-of-vermelho-casal-conjuges-amor.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500"
                 style=
                 "height: 350px; 
                 width: 300px; 
                 border-radius: 8px; 
                 box-shadow: 0 4px 10px rgba(0,0,0,0.15);" /> 
            </div>

        </div>

    </div>

     <div id="janelaLoop" class="janela-fundo invisivel" style="z-index: 10000;"> 
        <div class="sub-janela-conteudo">
            <button class="botao-fechar" id="btnFecharLoop">&times;</button>
            
            <p>Aqui era pra ter uma mini surpresinha, mas eu nn consguei por aqui, então vou te mostrar de outra forma ksksks</p>
            <a href="https://drive.google.com/file/d/16ObkDXEWfUDD2t1Lj-tTmcK-YfBXHcMo/view?usp=drivesdk" target="_blank" style="text-decoration: none;"> clica aqui
                 </a>
            
            <div id="conteudoDoLoop" style="margin-top: 15px; font-size: 18px; color: #9d12d4;"></div>
        </div>
    </div>
    

    <script>
        const janela = document.getElementById('minhaJanela');
        const btnAbrir = document.getElementById('btnAbrir');
        const btnFechar = document.getElementById('btnFechar');

        const janelaLoop = document.getElementById('janelaLoop');
        const btnFecharLoop = document.getElementById('btnFecharLoop');
        const meuBotao1 = document.getElementById('meuBotao1');

        btnAbrir.addEventListener('click', () => {
            janela.classList.remove('invisivel');
        });

        btnFechar.addEventListener('click', () => {
            janela.classList.add('invisivel');
        });

        janela.addEventListener('click', (evento) => {
            if (evento.target === janela) {
                janela.classList.add('invisivel');
            }
        });

        btnFecharLoop.addEventListener('click', () => { 
            janelaLoop.classList.add('invisivel'); 
        }); 

        meuBotao1.addEventListener('click', () => {
            janelaLoop.classList.remove('invisivel');
            
        });


    </script>
</body>
</html>
